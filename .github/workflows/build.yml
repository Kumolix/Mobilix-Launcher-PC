name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Dependencies
        run: |
          go get github.com/jchv/go-webview2@latest
          go mod tidy
      - name: Test
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          go test ./...
      - name: Windows resources (icon, manifest)
        run: |
          go install github.com/tc-hib/go-winres@latest
          "$(go env GOPATH)/bin/go-winres" make --in winres/winres.json --out rsrc
      - name: Build
        run: |
          mkdir dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H=windowsgui" -o dist/Mobilix-Launcher.exe .
          rm -f rsrc_windows_*.syso
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o dist/Mobilix-Launcher-linux-x64 .
      - uses: actions/upload-artifact@v4
        with:
          name: Mobilix-Launcher-PC
          path: dist/*
